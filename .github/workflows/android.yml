name: Android CI

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: 编译 APK
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: 下载并安装 Android Command Line Tools
        run: |
          mkdir -p $HOME/android-sdk
          cd $HOME/android-sdk
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip -q tools.zip
          rm tools.zip
          # 检查实际目录结构
          find . -name "sdkmanager" -type f

      - name: 安装 SDK 组件并编译
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          # 找到 sdkmanager 的实际位置
          SDKMANAGER=$(find $ANDROID_HOME -name "sdkmanager" -type f | head -1)
          echo "Found sdkmanager at: $SDKMANAGER"
          export PATH=$PATH:$(dirname $SDKMANAGER)
          echo "PATH=$PATH"
          yes | $SDKMANAGER --sdk_root=$ANDROID_HOME "platforms;android-35" "build-tools;35.0.0"
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
